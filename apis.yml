name: Mantle
description: >-
  Mantle is an AI-powered data platform for alternative assets management,
  positioning itself as "alternative assets data, structured for the agentic
  era." It offers two products: Mantle Equity, a cap table management platform
  for founders and CFOs covering fundraising, SAFEs, stock options, 409A
  valuations, and QSBS attestation; and Mantle Portal, a portfolio management
  and insights product for institutional investors such as endowments and family
  offices. Mantle converts fragmented documents into structured, trustworthy
  data and layers AI workflows on top. The company is SOC 2 Type II compliant and
  is backed by Sierra Ventures. As of this enrichment pass no public developer
  API or API documentation was found; the product is delivered as a hosted SaaS
  application with an end-user help center.
